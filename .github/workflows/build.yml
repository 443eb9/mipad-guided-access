---
name: Build MiPad Guided Access

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: >-  # v7
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: >-  # v4
          android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'

      - name: Download Xposed compile API
        run: |
          $uri = (
            'https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar'
          )
          $expected = (
            'f48c635f1c7469fdec0e00ad2ea0b7a6b2f5b55065784a35b7ca3a84615e8e25'
          )
          Invoke-WebRequest -Uri $uri -OutFile 'tools/xposed-api-82.jar'
          $hash = Get-FileHash 'tools/xposed-api-82.jar' -Algorithm SHA256
          if ($hash.Hash -ne $expected) {
            throw 'Xposed API checksum mismatch.'
          }

      - name: Restore signing keystore
        env:
          MIPAD_KEYSTORE_BASE64: ${{ secrets.MIPAD_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MIPAD_KEYSTORE_BASE64)) {
            throw 'Configure the MIPAD_KEYSTORE_BASE64 repository secret.'
          }
          New-Item -ItemType Directory -Force -Path 'keys' | Out-Null
          $bytes = [Convert]::FromBase64String($env:MIPAD_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes((Join-Path $PWD 'keys/mipad.p12'), $bytes)

      - name: Test and build
        env:
          MIPAD_KEYSTORE_PASSWORD: ${{ secrets.MIPAD_KEYSTORE_PASSWORD }}
          MIPAD_KEY_PASSWORD: ${{ secrets.MIPAD_KEY_PASSWORD }}
        run: python build.py

      - name: Remove signing keystore
        if: always()
        run: |
          if (Test-Path 'keys/mipad.p12') {
            Remove-Item 'keys/mipad.p12' -Force
          }

      - name: Upload APK and Magisk module
        uses: >-  # v7
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mipad-guided-access-${{ github.sha }}
          path: |
            dist/guided-access.apk
            dist/mipad-guided-access-*.zip
          if-no-files-found: error
          retention-days: 30
